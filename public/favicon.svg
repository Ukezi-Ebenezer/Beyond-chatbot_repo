<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f0f7ff" />
    </linearGradient>

    <linearGradient id="favRibbonLeftA" x1="120" y1="520" x2="380" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#25105a" />
      <stop offset="25%" stopColor="#4c1d95" />
      <stop offset="60%" stopColor="#6366f1" />
      <stop offset="90%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <linearGradient id="favRibbonCrestFold" x1="330" y1="150" x2="440" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="40%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#082f49" />
    </linearGradient>

    <linearGradient id="favRibbonRightF" x1="350" y1="180" x2="490" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="35%" stopColor="#0284c7" />
      <stop offset="75%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <linearGradient id="favWingTopGrad" x1="280" y1="210" x2="480" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="50%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <linearGradient id="favWingBottomGrad" x1="300" y1="320" x2="440" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0369a1" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <linearGradient id="favAfricaMapGrad" x1="170" y1="340" x2="260" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="50%" stopColor="#2e1065" />
      <stop offset="100%" stopColor="#3b0764" />
    </linearGradient>
  </defs>

  <!-- Clean rounded background badge so favicon stands out crisply in browser tabs on both dark and light OS themes -->
  <rect width="500" height="500" rx="100" fill="url(#favBg)" stroke="#bfdbfe" stroke-width="8" />

  <!-- 1. AFRICA MAP SILHOUETTE WITH AI CONSTELLATION NODES -->
  <g id="fav-africa-map-motif">
    <path
      d="M210 340 C235 340 250 350 255 365 C262 380 258 395 250 405 C245 412 252 425 248 438 C244 452 238 468 230 482 C226 490 220 488 215 478 C212 468 206 450 205 435 C204 420 188 418 178 408 C168 398 172 380 182 372 C190 365 192 352 198 344 Z"
      fill="url(#favAfricaMapGrad)"
      stroke="#4338ca"
      stroke-width="2"
    />

    <!-- Constellation Lines -->
    <g stroke="#38bdf8" stroke-width="2.2" opacity="0.95">
      <line x1="210" y1="355" x2="242" y2="375" />
      <line x1="242" y1="375" x2="238" y2="415" />
      <line x1="210" y1="355" x2="188" y2="385" />
      <line x1="188" y1="385" x2="215" y2="410" />
      <line x1="215" y1="410" x2="238" y2="415" />
      <line x1="215" y1="410" x2="225" y2="455" />
      <line x1="238" y1="415" x2="225" y2="455" />
      <line x1="225" y1="455" x2="222" y2="478" />
      <line x1="242" y1="375" x2="252" y2="400" />
    </g>

    <!-- Glowing Nodes -->
    <g fill="#ffffff">
      <circle cx="210" cy="355" r="4.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="242" cy="375" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="252" cy="400" r="3.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="188" cy="385" r="4.8" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="215" cy="410" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="238" cy="415" r="5.5" fill="#ffffff" stroke="#00f0ff" stroke-width="2" />
      <circle cx="225" cy="455" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="222" cy="478" r="3.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
    </g>
  </g>

  <!-- 2. 'F' LOWER WING -->
  <path
    d="M292 342 C300 370 340 375 390 368 C375 390 320 398 285 378 Z"
    fill="#0c1e3e"
    opacity="0.9"
  />
  <path
    d="M272 315 H395 C412 315 425 328 420 345 C416 358 402 368 385 368 H290 Z"
    fill="url(#favWingBottomGrad)"
  />

  <!-- 3. 'A' MAIN LEFT 3D RIBBON LOOP -->
  <path
    d="M110 500 C95 470 105 435 130 390 L205 255 C225 218 248 185 272 165 C290 150 310 152 325 168 C338 182 335 205 318 230 L240 355 L165 488 C150 515 125 525 110 500 Z"
    fill="url(#favRibbonLeftA)"
  />

  <!-- 4. 'A' TOP CREST FOLD -->
  <path
    d="M272 165 C290 150 315 152 332 170 C345 184 345 202 335 220 L312 258 L278 205 Z"
    fill="url(#favRibbonCrestFold)"
  />

  <!-- 5. 'F' TOP WING -->
  <path
    d="M295 240 C320 270 380 278 440 262 C415 285 350 292 290 268 Z"
    fill="#08234d"
    opacity="0.95"
  />
  <path
    d="M270 215 H425 C448 215 465 228 460 248 C455 264 438 274 418 274 H288 Z"
    fill="url(#favWingTopGrad)"
  />

  <!-- 6. RIGHT DESCENDING PILLAR STEM -->
  <path
    d="M312 215 L355 178 C370 190 375 208 368 228 L275 425 C265 448 250 472 238 495 C225 520 200 528 188 505 C180 488 190 465 202 440 L290 255 Z"
    fill="url(#favRibbonRightF)"
    opacity="0.95"
  />
</svg>
